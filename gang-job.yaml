apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata: {name: gang-test}
spec:
  schedulerName: volcano
  queue: q1
  minAvailable: 4
  tasks:
  - name: worker
    replicas: 4
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: busy
          image: busybox
          command: ["sleep", "300"]
          resources: {requests: {cpu: "1"}, limits: {cpu: "1"}}
